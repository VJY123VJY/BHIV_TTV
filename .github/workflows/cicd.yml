name: BHIV TTV Production Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GitHub SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Generate Compose file for validation
        run: |
          sed "s|IMG_TAG|$short_sha|g" docker-compose.production.template.yml > docker-compose.production.yml

      - name: Create stub .env for compose validation
        run: |
          touch .env

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.production.yml config

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            docker-compose.production.template.yml

  build:
    name: Build production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push bhiv/ttv-service image
        run: |
          docker buildx build --push \
            --tag bhiv/ttv-service:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/ttv-service:latest \
            -f Dockerfile .

  deploy:
    name: Deploy to remote production VM via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts

      - name: Create env file from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.TTV_BACKEND_ENV || secrets.BACKEND_ENV_FILE || secrets.TTV_ENV_FILE }}
          EOF

      - name: Tar deployment files
        run: |
          tar -czf deployment.tar.gz docker-compose.production.template.yml .env

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create BHIV_TTV directory structure on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "mkdir -p ~/BHIV_TTV/generated/videos ~/BHIV_TTV/generated/temp ~/BHIV_TTV/generated/images ~/BHIV_TTV/generated/scenes ~/BHIV_TTV/generated/audio"

      - name: Copy deployment tarball to VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" scp -P ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no deployment.tar.gz ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/BHIV_TTV/deployment.tar.gz

      - name: Deploy production stack on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BHIV_TTV
            
            # Clean directory first, keeping docs, generated media folder, and the tarball
            find . -mindepth 1 ! -name docs ! -path './docs*' ! -name generated ! -path './generated*' ! -name deployment.tar.gz -exec rm -rf {} +
            
            # Extract deployment archive and clean up tarball
            tar -xzf deployment.tar.gz
            rm -f deployment.tar.gz
            
            # Confirm Docker availability
            docker version
            docker compose version
            
            # Log in to Docker Hub on the VM
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Restore persistent Release History
            mkdir -p docs
            if [ -f /var/tmp/BHIV_TTV/RELEASE_HISTORY.md ]; then
              cp /var/tmp/BHIV_TTV/RELEASE_HISTORY.md docs/RELEASE_HISTORY.md
            fi
            
            # Generate target compose file from template
            sed "s|IMG_TAG|${{ needs.build.outputs.sha_short }}|g" docker-compose.production.template.yml > docker-compose.production.yml
            
            # Validate compose config before deploy
            docker compose -f docker-compose.production.yml config
            
            # Pull images
            docker compose -f docker-compose.production.yml pull
            
            # Log out from Docker Hub
            docker logout
            
            # Launch container stack
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            
            # Verify deployment status
            docker compose -f docker-compose.production.yml ps
            
            # Health Check loop (up to 12 iterations x 10s = 120s)
            echo "Waiting for BHIV TTV service to be healthy..."
            for i in {1..12}; do
              if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
              else
                UNHEALTHY_COUNT=0
                STARTING_COUNT=0
              fi
              
              # Container health check status
              TTV_HEALTH=0
              TTV_STATUS=$(docker inspect --format='{{.State.Health.Status}}' ttv_service_prod 2>/dev/null || echo "missing")
              [ "$TTV_STATUS" = "healthy" ] && TTV_HEALTH=1

              # HTTP endpoint check on host port 8019
              HTTP_HEALTH=0
              curl -sf http://localhost:8019/health > /dev/null && HTTP_HEALTH=1
              
              if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$TTV_HEALTH" -eq 1 ] && [ "$HTTP_HEALTH" -eq 1 ]; then
                echo "BHIV TTV container and healthcheck endpoint are healthy!"
                break
              fi
              
              if [ "$i" -eq 12 ]; then
                echo "Health check failed!"
                docker compose -f docker-compose.production.yml ps
                docker compose -f docker-compose.production.yml logs --tail=50
                exit 1
              fi
              
              echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy, container_healthy=$TTV_HEALTH, http_healthy=$HTTP_HEALTH. Retrying in 10s..."
              sleep 10
            done
            
            # Prune old unused images
            docker image prune -af --filter "until=168h"
          EOF

      - name: Update Release Documentation on Success
        if: success()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BHIV_TTV
            if [ ! -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p docs
              echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
              echo "" >> docs/RELEASE_HISTORY.md
              echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
              echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
            fi
            echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | SUCCESS | Stable deployment |" >> docs/RELEASE_HISTORY.md
          EOF

      - name: Save persistent Release History
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BHIV_TTV
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/BHIV_TTV
              cp docs/RELEASE_HISTORY.md /var/tmp/BHIV_TTV/RELEASE_HISTORY.md
            fi
          EOF

  rollback:
    name: Rollback on deployment failure
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Automatic Rollback on Failure
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BHIV_TTV
            
            # Robust parsing of Release History to extract the last healthy SHA
            if [ -f docs/RELEASE_HISTORY.md ] && grep -qE "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md; then
              LAST_HEALTHY_TAG=$(grep -E "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md | tail -n 1 | awk -F '|' '{
                for(i=1; i<=NF; i++) {
                  gsub(/[[:space:]]/, "", $i);
                  if ($i ~ /^[0-9a-f]{7}$/) {
                    print $i;
                    exit;
                  }
                }
              }')
              
              if [ -z "$LAST_HEALTHY_TAG" ]; then
                echo "⚠️ No last healthy tag extracted from Release History. Falling back to 'latest'."
                LAST_HEALTHY_TAG="latest"
              fi
              
              echo "🚨 Deployment failed! Rolling back to tag: $LAST_HEALTHY_TAG"
              
              sed "s|IMG_TAG|$LAST_HEALTHY_TAG|g" docker-compose.production.template.yml > docker-compose.production.yml
              
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
              docker compose -f docker-compose.production.yml pull
              docker logout
              
              docker compose -f docker-compose.production.yml up -d --remove-orphans
              docker compose -f docker-compose.production.yml ps
              
              echo "Waiting for rollback service to be healthy..."
              for i in {1..12}; do
                if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                  UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                  STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
                else
                  UNHEALTHY_COUNT=0
                  STARTING_COUNT=0
                fi
                
                TTV_HEALTH=0
                TTV_STATUS=$(docker inspect --format='{{.State.Health.Status}}' ttv_service_prod 2>/dev/null || echo "missing")
                [ "$TTV_STATUS" = "healthy" ] && TTV_HEALTH=1
                
                HTTP_HEALTH=0
                curl -sf http://localhost:8019/health > /dev/null && HTTP_HEALTH=1
                
                if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$TTV_HEALTH" -eq 1 ] && [ "$HTTP_HEALTH" -eq 1 ]; then
                  echo "Rollback deployment is healthy!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_SUCCESS | Rollback from failed ${{ needs.build.outputs.sha_short }} is healthy |" >> docs/RELEASE_HISTORY.md
                  exit 0
                fi
                
                if [ "$i" -eq 12 ]; then
                  echo "Rollback health check failed!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_FAILED | Rollback from failed ${{ needs.build.outputs.sha_short }} failed health check |" >> docs/RELEASE_HISTORY.md
                  exit 1
                fi
                
                echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy. Retrying in 10s..."
                sleep 10
              done
            else
              echo "⚠️ No release history found. Attempting rollback to 'latest' tag."
              sed "s|IMG_TAG|latest|g" docker-compose.production.template.yml > docker-compose.production.yml
              docker compose -f docker-compose.production.yml up -d --remove-orphans
            fi
          EOF
