services:
  ttv-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: bhiv/ttv-service:local
    container_name: ttv_service
    restart: unless-stopped
    ports:
      - "8019:8000"
    env_file:
      - .env
    volumes:
      - ./generated:/app/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ttv_network

  ttv-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: bhiv/ttv-frontend:local
    container_name: ttv_frontend
    restart: unless-stopped
    ports:
      - "8021:8000"
    env_file:
      - frontend.env
    depends_on:
      ttv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ttv_network

networks:
  ttv_network:
    driver: bridge

