services:
  ttv-service:
    image: bhiv/ttv-service:IMG_TAG
    container_name: ttv_service_prod
    restart: always
    ports:
      - "8019:8000"
    env_file:
      - .env
    volumes:
      - ./generated:/app/generated
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ttv_network

  ttv-frontend:
    image: bhiv/ttv-frontend:IMG_TAG
    container_name: ttv_frontend_prod
    restart: always
    ports:
      - "8021:8000"
    env_file:
      - frontend.env
    depends_on:
      ttv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ttv_network

networks:
  ttv_network:
    driver: bridge

